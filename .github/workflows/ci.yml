name: Reach verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reach-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run core release browser smoke tests
        env:
          REACH_RELEASE_PROFILE: core
          REACH_APP_ORIGIN: http://localhost:3000
        run: >-
          npm run test:e2e --
          tests/simple-food.spec.ts
          tests/simple-food-trip.spec.ts
          tests/release-journey.spec.ts
          tests/theme-default.spec.ts
          tests/pantry-recommendation.spec.ts
          tests/location-follow.spec.ts
          --project=mobile
          --project=desktop
      - name: Build the production image without runtime credentials
        run: docker build --tag reach:ci .
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
