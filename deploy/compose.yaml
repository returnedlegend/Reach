services:
  app:
    image: reach-app:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL-}
        NEXT_PUBLIC_MAP_RASTER_TILE_URL: ${NEXT_PUBLIC_MAP_RASTER_TILE_URL-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION-}
        NEXT_PUBLIC_MAP_RASTER_ATTRIBUTION: ${NEXT_PUBLIC_MAP_RASTER_ATTRIBUTION-}
    env_file:
      - ./production.env
    environment:
      NODE_ENV: production
      REACH_AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_TIMEOUT_MS: "40000"
      REACH_RELEASE_PROFILE: extended
      REACH_RELEASE_AI: "true"
      REACH_AI_DATA_POLICY_ACCEPTED: "true"
      REACH_PROCESS_ROLE: app
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      REACH_ENVIRONMENT: production
      REACH_COMMUNITY_DB: /var/lib/reach/community.sqlite
    volumes:
      - reach-data:/var/lib/reach
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - reach
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - reach
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3.2:3b"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - reach
    restart: "no"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    environment:
      REACH_DOMAIN: ${REACH_DOMAIN:?Set REACH_DOMAIN in deploy/production.env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - reach
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


volumes:
  ollama-data:
  reach-data:
  caddy-data:
  caddy-config:

networks:
  reach:
    driver: bridge
